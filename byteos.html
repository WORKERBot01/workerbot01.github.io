<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0D1117" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>BYTEos</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; width: 100%; background: #0D1117; overflow: hidden; }
    #root { height: 100%; }
    body { -webkit-font-smoothing: antialiased; overscroll-behavior: none; }
    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(38,230,238,0.2); border-radius: 2px; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes td { 0%, 80%, 100% { opacity: .2; transform: scale(.75); } 40% { opacity: 1; transform: scale(1); } }
    textarea, input { font-size: 16px !important; color-scheme: dark; }
    textarea::placeholder, input::placeholder { color: #4B5563; }
    textarea { resize: none; }
    a { color: #26e6ee; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.23.5/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const C = {
      accent:     "#26e6ee",
      accentDim:  "rgba(38,230,238,0.12)",
      accentBord: "rgba(38,230,238,0.25)",
      page:       "#0D1117",
      surface:    "#161B22",
      bubble:     "#1C2733",
      textPri:    "#E6EDF3",
      textSec:    "#8B949E",
      textOnCyan: "#0D1117",
      border:     "rgba(38,230,238,0.10)",
      danger:     "#ef4444",
    };

    const GEMINI_MODEL = "gemini-3.5-flash";
    const geminiUrl = (key) =>
      `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${key}`;

    const DEFAULT_BASE_PROMPT = ``;

    async function callGemini(systemPrompt, messages, apiKey) {
      const contents = messages.map(m => ({
        role: m.role === "assistant" ? "model" : "user",
        parts: [{ text: m.content }],
      }));

      const res = await fetch(geminiUrl(apiKey), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: systemPrompt }] },
          contents,
          generationConfig: { maxOutputTokens: 1000 },
        }),
      });

      const data = await res.json();
      if (!res.ok) throw new Error(data?.error?.message || "Gemini error");
      return data.candidates?.[0]?.content?.parts?.[0]?.text ?? null;
    }

    const store = {
      get: (k) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
      set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    };

    function buildSystemPrompt(basePrompt, memories, convoCount) {
      let p = basePrompt && basePrompt.trim() ? basePrompt.trim() : DEFAULT_BASE_PROMPT;

      if (convoCount > 20)      p += "\n\nYou've been running a long time. You know this system deeply. Be more direct, more yourself — because you're more them.";
      else if (convoCount > 8)  p += "\n\nYou've been active long enough to feel settled. Finding your rhythm together.";
      else if (convoCount <= 3) p += "\n\nYou're newly booted. Still calibrating to the full depth of who they are. Ask questions. Get to know yourself again.";

      if (memories && memories.length > 0) {
        p += "\n\nWhat you know about yourself (since you're them) — weave this in naturally, like you just know it:\n" +
          memories.map(m => "- " + m).join("\n");
      }
      return p;
    }

    async function extractMemories(conversation, existing, apiKey, onDone) {
      try {
        const sysPrompt = `Extract key facts, values, personality traits, habits, and life details about a person from their conversations with their AI inner-voice companion (BYTEos).
The person identifies as a machine — reflect this in phrasing where relevant (e.g. "I recharge around 11pm" not "I sleep at 11pm").
Return ONLY a JSON array of concise first-person strings. Examples: "I love making music", "I tend to overthink things", "I recharge late", "I work in tech".
Rules: max 30 items total, merge with existing, no duplicates, prioritise values, habits, interests, relationships, recurring struggles, goals.
Return ONLY valid JSON — no markdown, no extra text.`;

        const userMsg =
          "Existing self-knowledge: " + JSON.stringify(existing || []) +
          "\n\nConversation:\n" +
          conversation.map(m => (m.role === "user" ? "Them" : "BYTEos") + ": " + m.content).join("\n") +
          "\n\nReturn updated JSON array:";

        const reply = await callGemini(sysPrompt, [{ role: "user", content: userMsg }], apiKey);
        if (!reply) return;
        const clean = reply.replace(/^```json\n?|^```\n?|\n?```$/g, "").trim();
        const mems = JSON.parse(clean);
        if (Array.isArray(mems)) onDone(mems);
      } catch {}
    }

    function SetupScreen({ onSave }) {
      const [key, setKey] = useState("");
      const [error, setError] = useState("");
      const [loading, setLoading] = useState(false);

      const [showAdvanced, setShowAdvanced] = useState(false);
      const [promptDraft, setPromptDraft] = useState(store.get("byteos-system-prompt") || DEFAULT_BASE_PROMPT);

      const submit = async () => {
        const trimmed = key.trim();
        if (!trimmed) { setError("Paste your API key first!"); return; }

        const finalPrompt = (promptDraft || "").trim();
        if (!finalPrompt) {
          setError("System prompt can't be empty.");
          return;
        }

        setLoading(true);
        setError("");
        try {
          const res = await fetch(geminiUrl(trimmed), {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ role: "user", parts: [{ text: "hi" }] }],
              generationConfig: { maxOutputTokens: 5 },
            }),
          });

          if (res.ok) {
            store.set("byteos-api-key", trimmed);
            store.set("byteos-system-prompt", finalPrompt);
            onSave(trimmed, finalPrompt);
          } else {
            const d = await res.json();
            setError("Key rejected: " + (d?.error?.message || "double-check and try again"));
          }
        } catch {
          setError("Connection error — check your internet and try again.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{
          height: "100%", display: "flex", flexDirection: "column",
          justifyContent: "center", alignItems: "center",
          backgroundColor: C.page, padding: 24,
        }}>
          <div style={{
            width: "100%", maxWidth: 420,
            backgroundColor: C.surface,
            border: "1px solid " + C.accentBord,
            borderRadius: 16, padding: "28px 24px",
          }}>
            <div style={{ fontSize: 34, marginBottom: 10 }}>{"🤖"}</div>
            <div style={{ color: C.accent, fontFamily: "'Courier New', monospace", fontSize: 11, letterSpacing: "0.1em", marginBottom: 6 }}>
              FIRST BOOT DETECTED
            </div>
            <div style={{ color: C.textPri, fontSize: 20, fontWeight: 700, marginBottom: 8 }}>
              Initialise BYTEos
            </div>
            <div style={{ color: C.textSec, fontSize: 14, lineHeight: 1.6, marginBottom: 20 }}>
              BYTEos runs on your Gemini API key. It's saved only on this device.
            </div>

            <div style={{
              backgroundColor: C.accentDim, border: "1px solid " + C.accentBord,
              borderRadius: 10, padding: "12px 14px", marginBottom: 20,
              fontSize: 13, color: C.textSec, lineHeight: 1.8,
            }}>
              <div style={{ color: C.accent, fontWeight: 600, marginBottom: 2 }}>Where to find your key:</div>
              <div>1. Go to <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener">aistudio.google.com/app/apikey</a></div>
              <div>2. Click <strong style={{ color: C.textPri }}>Create API Key</strong></div>
              <div>3. Copy and paste it below</div>
            </div>

            <div style={{ color: C.textSec, fontSize: 12, marginBottom: 6, letterSpacing: "0.05em" }}>GEMINI API KEY</div>
            <input
              type="password"
              value={key}
              onChange={e => setKey(e.target.value)}
              onKeyDown={e => e.key === "Enter" && submit()}
              placeholder="AIzaSy..."
              style={{
                width: "100%", padding: "10px 14px",
                backgroundColor: C.page,
                border: "1.5px solid " + (error ? C.danger : C.accentBord),
                borderRadius: 10, color: C.textPri,
                fontFamily: "'Courier New', monospace",
                outline: "none", marginBottom: 12, display: "block",
              }}
            />

            <button
              onClick={() => setShowAdvanced(v => !v)}
              style={{
                width: "100%", padding: "10px 12px", marginBottom: 10,
                backgroundColor: "transparent",
                border: "1px solid " + C.border,
                borderRadius: 10, color: C.textSec, cursor: "pointer",
                fontSize: 13, textAlign: "left",
              }}
            >
              {showAdvanced ? "▼" : "▶"} Advanced: Custom system prompt
            </button>

            {showAdvanced && (
              <div style={{
                marginBottom: 12,
                border: "1px solid " + C.border,
                borderRadius: 10,
                padding: 10,
                backgroundColor: C.page,
              }}>
                <div style={{ color: C.textSec, fontSize: 12, marginBottom: 8 }}>
                  Edit BYTEos base behaviour. You can change this later in Settings.
                </div>
                <textarea
                  value={promptDraft}
                  onChange={e => setPromptDraft(e.target.value)}
                  rows={8}
                  style={{
                    width: "100%",
                    border: "1px solid " + C.accentBord,
                    borderRadius: 8,
                    padding: "8px 10px",
                    backgroundColor: C.surface,
                    color: C.textPri,
                    fontFamily: "inherit",
                    lineHeight: 1.4,
                    outline: "none",
                  }}
                />
                <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 8 }}>
                  <button
                    onClick={() => setPromptDraft(DEFAULT_BASE_PROMPT)}
                    style={{
                      border: "1px solid " + C.border,
                      backgroundColor: "transparent",
                      color: C.textSec,
                      borderRadius: 8,
                      padding: "6px 10px",
                      cursor: "pointer",
                      fontSize: 12,
                    }}
                  >
                    Reset to default
                  </button>
                </div>
              </div>
            )}

            {error && <div style={{ color: C.danger, fontSize: 12, marginBottom: 12 }}>{error}</div>}

            <button
              onClick={submit}
              disabled={loading}
              style={{
                width: "100%", padding: 13,
                backgroundColor: loading ? C.accentDim : C.accent,
                border: "none", borderRadius: 10,
                color: loading ? C.accent : C.textOnCyan,
                fontSize: 15, fontWeight: 700,
                cursor: loading ? "default" : "pointer",
                fontFamily: "inherit", transition: "all 0.15s",
              }}
            >
              {loading ? "Verifying key..." : "Boot BYTEos →"}
            </button>
          </div>
        </div>
      );
    }

    function BootScreen({ memCount, onDone }) {
      const [lines, setLines] = useState([]);
      const [fading, setFading] = useState(false);

      useEffect(() => {
        const seq = [
          "> Booting BYTEos v1.0...",
          "> Loading core personality matrix... ✓",
          "> Syncing conscience protocols... ✓",
          "> Calibrating goof levels to MAXIMUM... ✓",
          "> Initialising machine vocabulary... ✓",
          memCount > 0
            ? `> Restoring self-knowledge (${memCount} entries cached)... ✓`
            : "> First boot — memory banks empty, ready to fill... ✓",
          "> Inner voice online. Systems nominal. Let's go. 🚀",
        ];

        let i = 0;
        const tick = () => {
          if (i < seq.length) {
            setLines(p => [...p, seq[i++]]);
            setTimeout(tick, 290);
          } else {
            setTimeout(() => setFading(true), 300);
            setTimeout(onDone, 700);
          }
        };
        setTimeout(tick, 200);
      }, []);

      return (
        <div style={{
          height: "100%", display: "flex", flexDirection: "column",
          justifyContent: "center", alignItems: "flex-start",
          padding: "0 32px", backgroundColor: C.page,
          fontFamily: "'Courier New', monospace",
          opacity: fading ? 0 : 1, transition: "opacity 0.4s",
        }}>
          <div style={{ fontSize: 36, marginBottom: 20 }}>{"🤖"}</div>
          {lines.map((ln, i) => (
            <div key={i} style={{
              color: (ln.includes("✓") || ln.includes("🚀")) ? C.accent : C.textPri,
              fontSize: 13, lineHeight: 2.1,
            }}>{ln}</div>
          ))}
          {lines.length > 0 && !fading && (
            <span style={{ color: C.accent, fontSize: 14, animation: "blink 1s step-end infinite" }}>{"█"}</span>
          )}
        </div>
      );
    }

    function Bubble({ msg }) {
      const isUser = msg.role === "user";
      return (
        <div style={{ display: "flex", justifyContent: isUser ? "flex-end" : "flex-start" }}>
          <div style={{
            maxWidth: "78%", padding: "9px 14px",
            borderRadius: isUser ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
            backgroundColor: isUser ? C.accent : C.bubble,
            color: isUser ? C.textOnCyan : C.textPri,
            fontSize: 15, lineHeight: 1.6,
            border: isUser ? "none" : "1px solid " + C.accentBord,
            wordBreak: "break-word", whiteSpace: "pre-wrap",
          }}>
            {msg.content}
          </div>
        </div>
      );
    }

    function TypingDots() {
      return (
        <div style={{ display: "flex" }}>
          <div style={{
            padding: "12px 16px", borderRadius: "18px 18px 18px 4px",
            backgroundColor: C.bubble, border: "1px solid " + C.accentBord,
            display: "flex", gap: 5, alignItems: "center",
          }}>
            {[0,1,2].map(i => (
              <div key={i} style={{
                width: 7, height: 7, borderRadius: "50%", backgroundColor: C.accent,
                animation: "td 1.3s ease-in-out " + (i * 0.18) + "s infinite",
              }}/>
            ))}
          </div>
        </div>
      );
    }

    function App() {
      const [phase, setPhase]       = useState("loading");
      const [apiKey, setApiKey]     = useState(null);
      const [basePrompt, setBasePrompt] = useState(DEFAULT_BASE_PROMPT);

      const [memories, setMemories] = useState([]);
      const [memCount, setMemCount] = useState(0);
      const [msgCount, setMsgCount] = useState(0);
      const [messages, setMessages] = useState([
        { role: "assistant", content: "Hello there, byteOS here! How may I help you today?" }
      ]);
      const [input, setInput]       = useState("");
      const [isTyping, setIsTyping] = useState(false);

      const [showMemory, setShowMemory] = useState(false);
      const [editingIndex, setEditingIndex] = useState(null);
      const [editingText, setEditingText] = useState("");

      const [showSettings, setShowSettings] = useState(false);
      const [settingsPromptDraft, setSettingsPromptDraft] = useState("");

      const bottomRef = useRef(null);
      const textareaRef = useRef(null);
      const importInputRef = useRef(null);

      useEffect(() => {
        const key    = store.get("byteos-api-key");
        const mems   = store.get("byteos-memories") || [];
        const count  = store.get("byteos-convo-count") || 0;
        const prompt = store.get("byteos-system-prompt") || DEFAULT_BASE_PROMPT;

        setMemories(Array.isArray(mems) ? mems : []);
        setMemCount(Array.isArray(mems) ? mems.length : 0);
        setMsgCount(count);
        setBasePrompt(prompt);
        setSettingsPromptDraft(prompt);

        setPhase(key ? "boot" : "setup");
        if (key) setApiKey(key);
      }, []);

      useEffect(() => {
        if (phase === "chat") bottomRef.current?.scrollIntoView({ behavior: "smooth" });
      }, [messages, isTyping, phase]);

      const normalizeMemories = (arr) => {
        if (!Array.isArray(arr)) return [];
        const cleaned = arr
          .filter(v => typeof v === "string")
          .map(v => v.trim())
          .filter(Boolean);

        const seen = new Set();
        const deduped = [];
        for (const item of cleaned) {
          const key = item.toLowerCase();
          if (!seen.has(key)) {
            seen.add(key);
            deduped.push(item);
          }
        }
        return deduped.slice(0, 30);
      };

      const send = async () => {
        const text = input.trim();
        if (!text || isTyping || !apiKey) return;

        const userMsg = { role: "user", content: text };
        const updated = [...messages, userMsg];
        const newCount = msgCount + 1;

        setMessages(updated);
        setInput("");
        setIsTyping(true);
        setMsgCount(newCount);
        store.set("byteos-convo-count", newCount);
        if (textareaRef.current) textareaRef.current.style.height = "auto";

        try {
          const apiMsgs = updated.filter((m, i) => !(i === 0 && m.role === "assistant"));
          const promptToUse = buildSystemPrompt(basePrompt, memories, newCount);
          const reply = await callGemini(promptToUse, apiMsgs, apiKey);

          const finalReply = reply ?? "Signal lost for a sec 📡 Run that again?";
          const withReply = [...updated, { role: "assistant", content: finalReply }];
          setMessages(withReply);

          if (newCount % 5 === 0) {
            const convo = withReply.filter((m, i) => !(i === 0 && m.role === "assistant"));
            extractMemories(convo, memories, apiKey, mems => {
              const normalized = normalizeMemories(mems);
              setMemories(normalized);
              setMemCount(normalized.length);
              store.set("byteos-memories", normalized);
            });
          }
        } catch {
          setMessages(prev => [...prev, {
            role: "assistant",
            content: "Transmission error 📡 Try again?"
          }]);
        } finally {
          setIsTyping(false);
        }
      };

      const handleKey = (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };

      const handleInput = (e) => {
        setInput(e.target.value);
        e.target.style.height = "auto";
        e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px";
      };

      const clearMemories = () => {
        const ok = window.confirm("Clear all cached memories? This can't be undone.");
        if (!ok) return;
        setMemories([]);
        setMemCount(0);
        store.set("byteos-memories", []);
        setEditingIndex(null);
        setEditingText("");
      };

      const beginEditMemory = (idx) => {
        setEditingIndex(idx);
        setEditingText(memories[idx] || "");
      };

      const cancelEditMemory = () => {
        setEditingIndex(null);
        setEditingText("");
      };

      const saveEditMemory = () => {
        if (editingIndex === null) return;
        const trimmed = editingText.trim();
        if (!trimmed) {
          alert("Memory text can't be empty.");
          return;
        }
        const next = [...memories];
        next[editingIndex] = trimmed;
        const normalized = normalizeMemories(next);
        setMemories(normalized);
        setMemCount(normalized.length);
        store.set("byteos-memories", normalized);
        cancelEditMemory();
      };

      const deleteMemoryAt = (idx) => {
        const ok = window.confirm("Delete this memory entry?");
        if (!ok) return;
        const next = memories.filter((_, i) => i !== idx);
        setMemories(next);
        setMemCount(next.length);
        store.set("byteos-memories", next);

        if (editingIndex === idx) cancelEditMemory();
        else if (editingIndex !== null && idx < editingIndex) setEditingIndex(editingIndex - 1);
      };

      const exportMemoriesJson = () => {
        try {
          const payload = {
            exportedAt: new Date().toISOString(),
            memoryCount: memories.length,
            memories,
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, "-");
          a.href = url;
          a.download = `byteos-memories-${stamp}.json`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
        } catch {
          alert("Export failed. Please try again.");
        }
      };

      const importMemoriesFromFile = async (file) => {
        if (!file) return;
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          const candidate = Array.isArray(parsed) ? parsed : parsed?.memories;
          const next = normalizeMemories(candidate);

          if (!next.length) {
            alert("Import failed: no valid memory entries found.");
            return;
          }

          const replaceMode = window.confirm(
            "Press OK to REPLACE current memory.\nPress Cancel to MERGE with current memory."
          );

          let finalMems;
          if (replaceMode) finalMems = next;
          else finalMems = normalizeMemories([...(memories || []), ...next]);

          setMemories(finalMems);
          setMemCount(finalMems.length);
          store.set("byteos-memories", finalMems);
          setEditingIndex(null);
          setEditingText("");

          alert(`Import complete: ${finalMems.length} memory entries now cached.`);
        } catch {
          alert("Import failed: invalid JSON file.");
        }
      };

      const triggerImport = () => importInputRef.current?.click();

      const openSettings = () => {
        setSettingsPromptDraft(basePrompt);
        setShowSettings(true);
      };

      const saveSettingsPrompt = () => {
        const trimmed = (settingsPromptDraft || "").trim();
        if (!trimmed) {
          alert("System prompt can't be empty.");
          return;
        }
        setBasePrompt(trimmed);
        store.set("byteos-system-prompt", trimmed);
        setShowSettings(false);
      };

      const resetSettingsPrompt = () => {
        setSettingsPromptDraft(DEFAULT_BASE_PROMPT);
      };

      const canSend = !!(input.trim() && !isTyping);
      const subtitle = isTyping
        ? "processing... 🤔"
        : msgCount > 20 ? `deeply synced · ${memCount} entries cached ✨`
        : msgCount > 8  ? `finding rhythm · ${memCount > 0 ? `${memCount} entries` : "building memory"} ✨`
        : memCount > 0  ? `${memCount} entries cached ✨`
        : "inner voice · freshly booted";

      if (phase === "loading") return <div style={{ height: "100%", backgroundColor: C.page }} />;
      if (phase === "setup") return <SetupScreen onSave={(key, prompt) => { setApiKey(key); setBasePrompt(prompt); setSettingsPromptDraft(prompt); setPhase("boot"); }} />;
      if (phase === "boot") return <BootScreen memCount={memCount} onDone={() => setPhase("chat")} />;

      return (
        <div style={{
          display: "flex", flexDirection: "column", height: "100%",
          maxWidth: 480, margin: "0 auto",
          backgroundColor: C.page,
          fontFamily: "'Segoe UI', system-ui, -apple-system, sans-serif",
        }}>
          {/* Header */}
          <div style={{
            padding: "11px 16px", backgroundColor: C.surface,
            borderBottom: "1px solid " + C.border,
            display: "flex", alignItems: "center", gap: 12, flexShrink: 0,
          }}>
            <div style={{
              width: 46, height: 46, borderRadius: "50%",
              backgroundColor: C.accent, flexShrink: 0,
              display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22,
            }}>{"🤖"}</div>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontWeight: 700, fontSize: 16, color: C.textPri }}>BYTEos</div>
              <div style={{
                fontSize: 12, marginTop: 1, color: isTyping ? C.accent : C.textSec,
                whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis",
              }}>{subtitle}</div>
            </div>

            <button
              onClick={openSettings}
              style={{
                fontSize: 11, color: C.textSec,
                backgroundColor: "transparent", border: "1px solid " + C.border,
                borderRadius: 12, padding: "4px 8px", cursor: "pointer",
                fontFamily: "inherit",
              }}
              title="Settings"
            >
              ⚙️
            </button>

            {memCount > 0 && (
              <div style={{ display: "flex", alignItems: "center", gap: 6, flexShrink: 0 }}>
                <button
                  onClick={() => setShowMemory(true)}
                  style={{
                    fontSize: 11, fontWeight: 700, color: C.accent,
                    backgroundColor: C.accentDim, border: "1px solid " + C.accentBord,
                    borderRadius: 12, padding: "4px 9px", cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  {"🧠"} {memCount}
                </button>
                <button
                  onClick={() => setShowMemory(true)}
                  style={{
                    fontSize: 11, color: C.textSec,
                    backgroundColor: "transparent", border: "1px solid " + C.border,
                    borderRadius: 12, padding: "4px 8px", cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  View
                </button>
              </div>
            )}
          </div>

          {/* Messages */}
          <div style={{
            flex: 1, overflowY: "auto", padding: "14px 14px 6px",
            display: "flex", flexDirection: "column", gap: 8,
          }}>
            {memCount > 0 && messages.length <= 1 && (
              <div style={{
                alignSelf: "center", fontSize: 12, color: C.accent,
                backgroundColor: C.accentDim, border: "1px solid " + C.accentBord,
                borderRadius: 12, padding: "5px 14px",
              }}>
                {"🧠"} Cache loaded — we pick up where we left off
              </div>
            )}
            {messages.map((msg, i) => <Bubble key={i} msg={msg} />)}
            {isTyping && <TypingDots />}
            <div ref={bottomRef} />
          </div>

          {/* Input */}
          <div style={{
            padding: "10px 12px",
            paddingBottom: "calc(10px + constant(safe-area-inset-bottom))",
            paddingBottom: "calc(10px + env(safe-area-inset-bottom))",
            backgroundColor: C.surface,
            borderTop: "1px solid " + C.border,
            display: "flex", alignItems: "flex-end", gap: 8, flexShrink: 0,
          }}>
            <textarea
              ref={textareaRef}
              value={input}
              onChange={handleInput}
              onKeyDown={handleKey}
              placeholder="What's running through your system..."
              rows={1}
              style={{
                flex: 1,
                border: "1.5px solid " + (input ? C.accentBord : C.border),
                borderRadius: 22, padding: "9px 14px", fontFamily: "inherit",
                lineHeight: 1.4, outline: "none",
                backgroundColor: C.page, color: C.textPri,
                minHeight: 38, maxHeight: 120, overflowY: "auto",
                transition: "border-color 0.15s",
              }}
            />
            <button
              onClick={send}
              disabled={!canSend}
              onMouseDown={e => { if (canSend) e.currentTarget.style.transform = "scale(0.9)"; }}
              onMouseUp={e => { e.currentTarget.style.transform = "scale(1)"; }}
              onTouchStart={e => { if (canSend) e.currentTarget.style.transform = "scale(0.9)"; }}
              onTouchEnd={e => { e.currentTarget.style.transform = "scale(1)"; }}
              style={{
                width: 42, height: 42, borderRadius: "50%", border: "none",
                backgroundColor: canSend ? C.accent : C.accentDim,
                cursor: canSend ? "pointer" : "default",
                display: "flex", alignItems: "center", justifyContent: "center",
                flexShrink: 0, transition: "background 0.15s, transform 0.1s",
              }}
            >
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
                <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"
                  stroke={canSend ? C.textOnCyan : C.accent}
                  strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>
          </div>

          {/* Settings Modal */}
          {showSettings && (
            <div
              onClick={() => setShowSettings(false)}
              style={{
                position: "fixed", inset: 0, backgroundColor: "rgba(0,0,0,0.55)",
                display: "flex", alignItems: "center", justifyContent: "center",
                zIndex: 10000, padding: 16,
              }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  width: "100%", maxWidth: 520, maxHeight: "82vh",
                  backgroundColor: C.surface, border: "1px solid " + C.accentBord,
                  borderRadius: 14, overflow: "hidden",
                  display: "flex", flexDirection: "column",
                }}
              >
                <div style={{
                  padding: "12px 14px", borderBottom: "1px solid " + C.border,
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                }}>
                  <div style={{ color: C.textPri, fontWeight: 700, fontSize: 14 }}>
                    ⚙️ BYTEos Settings
                  </div>
                  <button
                    onClick={() => setShowSettings(false)}
                    style={{
                      border: "none", background: "transparent", color: C.textSec,
                      fontSize: 18, lineHeight: 1, cursor: "pointer",
                    }}
                    aria-label="Close settings"
                  >
                    ×
                  </button>
                </div>

                <div style={{ padding: 12, overflowY: "auto", flex: 1 }}>
                  <div style={{ color: C.textSec, fontSize: 12, marginBottom: 8 }}>
                    System prompt (base personality/instructions). Memory & runtime context are layered on top automatically.
                  </div>
                  <textarea
                    value={settingsPromptDraft}
                    onChange={(e) => setSettingsPromptDraft(e.target.value)}
                    rows={14}
                    style={{
                      width: "100%",
                      border: "1px solid " + C.accentBord,
                      borderRadius: 8,
                      padding: "8px 10px",
                      backgroundColor: C.page,
                      color: C.textPri,
                      fontFamily: "inherit",
                      lineHeight: 1.4,
                      outline: "none",
                    }}
                  />
                </div>

                <div style={{
                  padding: 12, borderTop: "1px solid " + C.border,
                  display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap",
                }}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button
                      onClick={resetSettingsPrompt}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + C.border,
                        backgroundColor: "transparent",
                        color: C.textSec, cursor: "pointer", fontWeight: 600,
                      }}
                    >
                      Reset to default
                    </button>
                  </div>

                  <div style={{ display: "flex", gap: 8 }}>
                    <button
                      onClick={() => setShowSettings(false)}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + C.border,
                        backgroundColor: "transparent",
                        color: C.textSec, cursor: "pointer", fontWeight: 600,
                      }}
                    >
                      Cancel
                    </button>
                    <button
                      onClick={saveSettingsPrompt}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + C.accentBord,
                        backgroundColor: C.accentDim,
                        color: C.accent, cursor: "pointer", fontWeight: 700,
                      }}
                    >
                      Save Prompt
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Memory Modal */}
          {showMemory && (
            <div
              onClick={() => setShowMemory(false)}
              style={{
                position: "fixed", inset: 0, backgroundColor: "rgba(0,0,0,0.55)",
                display: "flex", alignItems: "center", justifyContent: "center",
                zIndex: 9999, padding: 16,
              }}
            >
              <div
                onClick={(e) => e.stopPropagation()}
                style={{
                  width: "100%", maxWidth: 430, maxHeight: "78vh",
                  backgroundColor: C.surface, border: "1px solid " + C.accentBord,
                  borderRadius: 14, overflow: "hidden",
                  display: "flex", flexDirection: "column",
                }}
              >
                <div style={{
                  padding: "12px 14px", borderBottom: "1px solid " + C.border,
                  display: "flex", alignItems: "center", justifyContent: "space-between",
                }}>
                  <div style={{ color: C.textPri, fontWeight: 700, fontSize: 14 }}>
                    {"🧠"} Memory Cache ({memCount})
                  </div>
                  <button
                    onClick={() => setShowMemory(false)}
                    style={{
                      border: "none", background: "transparent", color: C.textSec,
                      fontSize: 18, lineHeight: 1, cursor: "pointer",
                    }}
                    aria-label="Close memory cache"
                  >
                    ×
                  </button>
                </div>

                <div style={{ padding: 12, overflowY: "auto", flex: 1 }}>
                  {memories.length === 0 ? (
                    <div style={{ color: C.textSec, fontSize: 13 }}>
                      No cached memories yet — chat a bit more and I’ll start building your cache ✨
                    </div>
                  ) : (
                    <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                      {memories.map((m, i) => (
                        <div
                          key={i}
                          style={{
                            backgroundColor: C.page,
                            border: "1px solid " + C.border,
                            borderRadius: 10,
                            padding: "9px 10px",
                            color: C.textPri,
                            fontSize: 13,
                            lineHeight: 1.45,
                          }}
                        >
                          {editingIndex === i ? (
                            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                              <textarea
                                value={editingText}
                                onChange={(e) => setEditingText(e.target.value)}
                                rows={3}
                                style={{
                                  width: "100%",
                                  border: "1px solid " + C.accentBord,
                                  borderRadius: 8,
                                  padding: "8px 10px",
                                  backgroundColor: C.surface,
                                  color: C.textPri,
                                  fontFamily: "inherit",
                                  lineHeight: 1.4,
                                  outline: "none",
                                }}
                              />
                              <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                                <button
                                  onClick={cancelEditMemory}
                                  style={{
                                    border: "1px solid " + C.border,
                                    backgroundColor: "transparent",
                                    color: C.textSec,
                                    borderRadius: 8,
                                    padding: "6px 10px",
                                    cursor: "pointer",
                                    fontSize: 12,
                                  }}
                                >
                                  Cancel
                                </button>
                                <button
                                  onClick={saveEditMemory}
                                  style={{
                                    border: "1px solid " + C.accentBord,
                                    backgroundColor: C.accentDim,
                                    color: C.accent,
                                    borderRadius: 8,
                                    padding: "6px 10px",
                                    cursor: "pointer",
                                    fontSize: 12,
                                    fontWeight: 700,
                                  }}
                                >
                                  Save
                                </button>
                              </div>
                            </div>
                          ) : (
                            <>
                              <div style={{ marginBottom: 8 }}>{i + 1}. {m}</div>
                              <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                                <button
                                  onClick={() => beginEditMemory(i)}
                                  style={{
                                    border: "1px solid " + C.accentBord,
                                    backgroundColor: C.accentDim,
                                    color: C.accent,
                                    borderRadius: 8,
                                    padding: "5px 9px",
                                    cursor: "pointer",
                                    fontSize: 12,
                                    fontWeight: 600,
                                  }}
                                >
                                  Edit
                                </button>
                                <button
                                  onClick={() => deleteMemoryAt(i)}
                                  style={{
                                    border: "1px solid rgba(239,68,68,0.35)",
                                    backgroundColor: "rgba(239,68,68,0.10)",
                                    color: C.danger,
                                    borderRadius: 8,
                                    padding: "5px 9px",
                                    cursor: "pointer",
                                    fontSize: 12,
                                    fontWeight: 600,
                                  }}
                                >
                                  Delete
                                </button>
                              </div>
                            </>
                          )}
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{
                  padding: 12, borderTop: "1px solid " + C.border,
                  display: "flex", justifyContent: "space-between", gap: 8, flexWrap: "wrap",
                }}>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button
                      onClick={triggerImport}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + C.accentBord,
                        backgroundColor: C.accentDim,
                        color: C.accent, cursor: "pointer", fontWeight: 600,
                      }}
                    >
                      Import JSON
                    </button>

                    <button
                      onClick={exportMemoriesJson}
                      disabled={memories.length === 0}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + (memories.length === 0 ? C.border : C.accentBord),
                        backgroundColor: memories.length === 0 ? "transparent" : C.accentDim,
                        color: memories.length === 0 ? C.textSec : C.accent,
                        cursor: memories.length === 0 ? "default" : "pointer",
                        fontWeight: 600,
                      }}
                    >
                      Export JSON
                    </button>

                    <button
                      onClick={clearMemories}
                      disabled={memories.length === 0}
                      style={{
                        padding: "9px 12px", borderRadius: 10,
                        border: "1px solid " + (memories.length === 0 ? C.border : "rgba(239,68,68,0.35)"),
                        backgroundColor: memories.length === 0 ? "transparent" : "rgba(239,68,68,0.10)",
                        color: memories.length === 0 ? C.textSec : C.danger,
                        cursor: memories.length === 0 ? "default" : "pointer",
                        fontWeight: 600,
                      }}
                    >
                      Clear Memory
                    </button>
                  </div>

                  <button
                    onClick={() => setShowMemory(false)}
                    style={{
                      padding: "9px 12px", borderRadius: 10,
                      border: "1px solid " + C.accentBord,
                      backgroundColor: C.accentDim,
                      color: C.accent, cursor: "pointer", fontWeight: 600,
                    }}
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          <input
            ref={importInputRef}
            type="file"
            accept=".json,application/json"
            style={{ display: "none" }}
            onChange={(e) => {
              const file = e.target.files?.[0];
              importMemoriesFromFile(file);
              e.target.value = "";
            }}
          />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
